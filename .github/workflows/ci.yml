name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Same image, password and host port as docker-compose.yml, so the API tests'
      # connection string (localhost,14330) works unchanged.
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Workshop!Passw0rd"
        ports:
          - 14330:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 20s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore (locked mode)
        run: dotnet restore Helpdesk.slnx --locked-mode

      - name: Build (warnings as errors)
        run: dotnet build Helpdesk.slnx --no-restore --configuration Release -warnaserror

      - name: Test - Tickets domain
        run: dotnet test tests/Helpdesk.Tickets.Domain.Tests --no-build --configuration Release

      - name: Test - Architecture rules
        run: dotnet test tests/Helpdesk.ArchitectureTests --no-build --configuration Release

      - name: Test - API (SQL Server)
        run: dotnet test tests/Helpdesk.ApiTests --no-build --configuration Release
